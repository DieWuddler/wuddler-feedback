name: 💡 Idee vorschlagen / Suggest an idea
description: Neue Blöcke, Tiere, Strecken, Spiele … / New blocks, animals, tracks, games …
title: "[Idee] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Wir freuen uns über jede Idee! Bitte keine persönlichen Daten angeben, alles hier ist öffentlich.
        We love new ideas! Please don't post personal data, everything here is public.
  - type: dropdown
    id: was
    attributes:
      label: Für welche Mod oder welches Spiel? / For which mod or game?
      options:
        - Wuddler One
        - Wuddler Nature
        - Wuddler Lorenrennen
        - Wuddler Flitzkiste
        - Wuddler Flugrennen
        - Spiel auf wuddler.com / Game on wuddler.com
        - Skin-Werkzeug auf wuddler.com (Werkstatt, Skinzauber, Pixelwurf) / Skin tool on wuddler.com (Workshop, Skin Magic, Pixel Mole)
        - Etwas anderes / Something else
        - Ganz neue Mod / A brand new mod
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Deine Idee / Your idea
      description: Was soll es geben, und wie soll es funktionieren? / What should exist, and how should it work?
    validations:
      required: true
  - type: checkboxes
    id: einverstanden
    attributes:
      label: Nutzung / Usage
      options:
        - label: Ich bin einverstanden, dass Die Wuddler meinen Beitrag kostenlos nutzen, verändern und veröffentlichen dürfen. Es gibt keinen Anspruch auf Umsetzung, Bezahlung oder Nennung. / I agree that Die Wuddler may use, change and publish my contribution for free. There is no claim to it being built, paid for or credited.
          required: true
